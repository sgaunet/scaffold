name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: docker
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fully-qualified URL: Forgejo resolves bare action names against its own
      # DEFAULT_ACTIONS_URL, which does not mirror jdx/mise-action.
      - name: Set up tools
        uses: https://github.com/jdx/mise-action@v4
        with:
          install: true
          cache: true

      - run: task lint
